<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>WhatsApp Chat Backup Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Roboto:wght@400;500;700&display=swap">
<style>/* Layout: the phone carries the page; a narrow note column beside it explains the open screen. Stacks at phone width. */
:root{
  --bg:#eef2ef; --surface:#ffffff; --fg:#17201b; --muted:#56625b; --line:#d6ddd8;
  --accent:#167a4a; --accent-soft:#dcefe4; --today:#8f530f; --today-soft:#f6ead8;
  --display:"Bricolage Grotesque","Roboto",system-ui,sans-serif; --body:"Roboto",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1311; --surface:#171e1b; --fg:#e5ebe7; --muted:#9ba7a0; --line:#2a3430;
  --accent:#57c98f; --accent-soft:#153223; --today:#e4a85d; --today-soft:#33250f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1311; --surface:#171e1b; --fg:#e5ebe7; --muted:#9ba7a0; --line:#2a3430;
  --accent:#57c98f; --accent-soft:#153223; --today:#e4a85d; --today-soft:#33250f; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:26px 48px}
.wrap{max-width:1120px;margin:0 auto;position:relative}
.about{position:absolute;top:0;right:0;z-index:30}
.about-btn{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--muted);font:italic 700 15px/1 Georgia,serif;cursor:pointer;display:grid;place-items:center}
.about-pop{position:absolute;top:40px;right:0;width:min(290px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13px;color:var(--muted);box-shadow:0 8px 24px rgba(0,0,0,.12)}
.about-pop b{color:var(--fg)}
.label{display:inline-block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--today);background:var(--today-soft);padding:4px 10px;border-radius:4px;font-weight:600}
h1{font-family:var(--display);font-weight:700;font-size:clamp(28px,4.2vw,44px);line-height:1.06;margin:14px 44px 10px 0;text-wrap:balance;letter-spacing:-.01em}
.lede{max-width:66ch;color:var(--muted);margin:0 0 16px}
.lede b{color:var(--fg);font-weight:500}
.toplinks{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:24px}
.pill{display:inline-flex;align-items:center;gap:6px;font:500 14px var(--body);padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--fg);text-decoration:none;cursor:pointer}
.pill.pri{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .pill.pri{color:#0b1410}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .pill.pri{color:#0b1410}}
.stage{display:grid;grid-template-columns:380px minmax(0,1fr);gap:44px;align-items:start}
@media (max-width:860px){.stage{grid-template-columns:minmax(0,1fr);gap:24px}}
.phone-col{display:flex;flex-direction:column;align-items:center;gap:12px;min-width:0}
.ctrl{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;max-width:380px}
.btn{font:500 13.5px var(--body);border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:8px 13px;border-radius:8px;cursor:pointer}
.btn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--fg)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .btn.pri{color:#0b1410}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.pri{color:#0b1410}}
.btn:disabled{opacity:.45;cursor:default}
.ctrl-k{font-size:12.5px;color:var(--muted);text-align:center}
.notes{min-width:0;max-width:62ch}
.kicker{font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:700}
.notes h2{font-family:var(--display);font-size:28px;line-height:1.15;margin:6px 0 12px;text-wrap:balance;font-weight:700}
.tag{display:inline-block;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;padding:3px 8px;border-radius:4px;margin-left:6px;vertical-align:3px}
.tag.new{background:var(--accent-soft);color:var(--accent)} .tag.changed{background:var(--today-soft);color:var(--today)} .tag.same{background:var(--line);color:var(--muted)}
.rows{display:grid;gap:10px;margin:14px 0 16px}
.rows div{display:grid;grid-template-columns:62px 1fr;gap:12px;align-items:baseline}
.rows b{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--today)}
.rows .n b{color:var(--accent)}
.try{border-left:3px solid var(--accent);padding:2px 0 2px 12px;margin:12px 0}
.done{color:var(--accent);font-weight:500}
.chap{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:22px 0 6px}
.steps-list{list-style:none;padding:0;margin:0;display:grid;gap:2px}
.steps-list button{width:100%;text-align:left;background:none;border:0;color:var(--muted);font:14px var(--body);padding:7px 8px;border-radius:6px;cursor:pointer;display:flex;gap:10px}
.steps-list .num{font-variant-numeric:tabular-nums;width:20px;flex:none}
.steps-list button[aria-current="true"]{background:var(--accent-soft);color:var(--fg);font-weight:500}
.jump{display:flex;flex-wrap:wrap;gap:8px}
details.primer{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin:0 0 22px;max-width:66ch}
details.primer summary{cursor:pointer;font-weight:500}
details.primer p{margin:8px 0 2px;color:var(--muted)}
.changes{margin:0 0 18px;padding-left:20px;max-width:66ch;display:grid;gap:6px}
.changes em{color:var(--muted);font-style:normal;font-size:13.5px}
.foot{margin-top:44px;padding-top:16px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
.foot a{color:var(--accent)}
.btn:focus-visible,.pill:focus-visible,.about-btn:focus-visible,.steps-list button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---- phone shell (WhatsApp Android, 2024+ design, as of Oct 2026) ---- */
.wa{--w-bg:#ffffff;--w-ink:#111b21;--w-sub:#667781;--w-line:#e9edef;--w-green:#1daa61;--w-green-ink:#008069;--w-chip:#f0f2f5;
  --w-wall:#efeae2;--w-in:#ffffff;--w-out:#d9fdd3;--w-sys:#fff8c4;--w-sys-ink:#54656f;--w-warn:#fff3dc;--w-warn-ink:#7a4a00;--w-red:#d33a2c;
  --w-sheet:#ffffff;--w-scrim:rgba(11,20,26,.45);--w-pill:#d8fdd2;--w-tick:#53bdeb;--w-toast:#323232;
  width:min(360px,100%);height:740px;border-radius:38px;border:10px solid #1b211e;background:var(--w-bg);color:var(--w-ink);
  font-family:"Roboto",system-ui,sans-serif;font-size:14px;line-height:1.35;position:relative;overflow:hidden;display:flex;flex-direction:column;
  box-shadow:0 20px 44px rgba(0,0,0,.2);user-select:none;-webkit-tap-highlight-color:transparent}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .wa{--w-bg:#0b141a;--w-ink:#e9edef;--w-sub:#8696a0;--w-line:#1f2c34;--w-green:#21c063;--w-green-ink:#21c063;--w-chip:#1f2c34;
  --w-wall:#0b141a;--w-in:#1f2c34;--w-out:#144d37;--w-sys:#1d2b23;--w-sys-ink:#ffd279;--w-warn:#33260f;--w-warn-ink:#f2c27a;--w-red:#f1665a;--w-sheet:#1f2c34;--w-scrim:rgba(0,0,0,.6);--w-pill:#103529;--w-toast:#3b4a54}}
:root[data-theme="dark"] .wa{--w-bg:#0b141a;--w-ink:#e9edef;--w-sub:#8696a0;--w-line:#1f2c34;--w-green:#21c063;--w-green-ink:#21c063;--w-chip:#1f2c34;
  --w-wall:#0b141a;--w-in:#1f2c34;--w-out:#144d37;--w-sys:#1d2b23;--w-sys-ink:#ffd279;--w-warn:#33260f;--w-warn-ink:#f2c27a;--w-red:#f1665a;--w-sheet:#1f2c34;--w-scrim:rgba(0,0,0,.6);--w-pill:#103529;--w-toast:#3b4a54}
.wa *{box-sizing:border-box}
.wa button{font-family:inherit;color:inherit}
.wa .st{height:26px;flex:none;display:flex;justify-content:space-between;align-items:center;padding:0 20px;font-size:12px;font-weight:500}
.wa .scr{flex:1;overflow-y:auto;overflow-x:hidden;position:relative;display:flex;flex-direction:column;scrollbar-width:none}
.wa .scr::-webkit-scrollbar{display:none}
.wa .gest{height:18px;flex:none;display:grid;place-items:center;cursor:pointer;background:var(--w-bg);border:0;width:100%;padding:0}
.wa .gest i{width:110px;height:4px;border-radius:2px;background:var(--w-sub);opacity:.7}
.wa .ic{width:24px;height:24px;flex:none;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.wa .ib{background:none;border:0;padding:8px;border-radius:50%;cursor:pointer;display:grid;place-items:center;color:inherit}
.wa .ib:hover{background:color-mix(in srgb,var(--w-sub) 12%,transparent)}
.wa .tb{display:flex;align-items:center;gap:4px;padding:6px 6px 6px 8px;min-height:56px;flex:none;background:var(--w-bg);position:sticky;top:0;z-index:3}
.wa .tb h3{margin:0;font-size:20px;font-weight:500;flex:1;padding-left:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wa .tb.home h3{font-size:23px;font-weight:700;color:var(--w-green-ink);padding-left:10px;letter-spacing:-.2px}
.wa .tb.home.plain h3{color:var(--w-ink);font-weight:500;font-size:22px}
.wa .srch{margin:2px 14px 6px;background:var(--w-chip);border-radius:24px;display:flex;align-items:center;gap:10px;padding:0 14px;height:44px;color:var(--w-sub)}
.wa .srch input{flex:1;border:0;background:none;font:16px "Roboto",system-ui,sans-serif;color:var(--w-ink);outline:none;min-width:0}
.wa .srch input::placeholder{color:var(--w-sub)}
.wa .chips{display:flex;gap:8px;padding:4px 14px 8px;overflow-x:auto;scrollbar-width:none;flex:none}
.wa .chip{background:var(--w-chip);color:var(--w-sub);border-radius:18px;padding:6px 13px;font-size:14px;white-space:nowrap;border:1px solid transparent;cursor:pointer}
.wa .chip.on{background:var(--w-pill);color:var(--w-green-ink);font-weight:500}
.wa .row{display:flex;align-items:center;gap:14px;padding:10px 16px;cursor:pointer;width:100%;background:none;border:0;text-align:left}
.wa .row:hover{background:color-mix(in srgb,var(--w-sub) 7%,transparent)}
.wa .av{width:50px;height:50px;border-radius:50%;flex:none;display:grid;place-items:center;color:#fff;font-weight:500;font-size:17px;position:relative}
.wa .av.sq{border-radius:14px}
.wa .av.sm{width:40px;height:40px;font-size:15px}
.wa .av.xl{width:96px;height:96px;font-size:34px}
.wa .av.ring{box-shadow:0 0 0 2px var(--w-bg),0 0 0 4.5px var(--w-green)}
.wa .mid{flex:1;min-width:0}
.wa .nm{font-size:16.5px;font-weight:500;display:flex;align-items:center;gap:6px;min-width:0}
.wa .nm>span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wa .sb{color:var(--w-sub);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:4px}
.wa .sb.wrap{white-space:normal;display:block}
.wa .mt{color:var(--w-sub);font-size:12px;display:grid;gap:5px;justify-items:end;flex:none}
.wa .mt.unr{color:var(--w-green-ink);font-weight:500}
.wa .badge{background:var(--w-green);color:#fff;border-radius:11px;font-size:11.5px;min-width:20px;height:20px;padding:0 6px;display:grid;place-items:center;font-weight:500}
:root[data-theme="dark"] .wa .badge{color:#0b141a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .wa .badge{color:#0b141a}}
.wa .co{width:16px;height:16px;color:var(--w-sub);flex:none}
.wa .ver{width:15px;height:15px;color:var(--w-green);flex:none}
.wa .ticks{width:17px;height:17px;color:var(--w-tick);flex:none}
.wa .ban{margin:4px 12px 8px;background:var(--w-warn);color:var(--w-warn-ink);border-radius:14px;padding:12px 14px;display:grid;gap:6px;font-size:13.5px}
.wa .ban b{font-size:14.5px}
.wa .ban .acts{display:flex;gap:18px}
.wa .lk{background:none;border:0;padding:0;color:var(--w-green-ink);font-weight:500;font-size:14px;cursor:pointer}
.wa .tabs{display:flex;border-top:1px solid var(--w-line);flex:none;background:var(--w-bg)}
.wa .tab{flex:1;text-align:center;font-size:12.5px;padding:8px 0 10px;color:var(--w-sub);display:grid;justify-items:center;gap:3px;background:none;border:0;cursor:pointer;position:relative}
.wa .tab.on{color:var(--w-ink);font-weight:600}
.wa .tab .pl{width:58px;height:30px;border-radius:15px;display:grid;place-items:center}
.wa .tab.on .pl{background:var(--w-pill)}
.wa .tab .dot{position:absolute;top:6px;left:calc(50% + 10px);min-width:18px;height:18px;border-radius:9px;background:var(--w-green);color:#fff;font-size:11px;display:grid;place-items:center;padding:0 5px;font-weight:500}
.wa .fabs{position:absolute;right:16px;bottom:84px;display:grid;gap:14px;justify-items:center;z-index:4}
.wa .fab{width:56px;height:56px;border-radius:16px;background:var(--w-green);color:#fff;border:0;display:grid;place-items:center;cursor:pointer;box-shadow:0 4px 10px rgba(0,0,0,.2)}
:root[data-theme="dark"] .wa .fab{color:#0b141a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .wa .fab{color:#0b141a}}
.wa .fab.ai{width:40px;height:40px;border-radius:50%;background:var(--w-bg);box-shadow:0 2px 8px rgba(0,0,0,.18)}
.wa .fab.ai i{width:22px;height:22px;border-radius:50%;background:conic-gradient(#3b82f6,#a855f7,#22d3ee,#3b82f6);-webkit-mask:radial-gradient(circle,transparent 6px,#000 7px);mask:radial-gradient(circle,transparent 6px,#000 7px)}
.wa .sec{padding:16px 16px 6px;color:var(--w-sub);font-size:14px;font-weight:500}
.wa .set{display:flex;gap:20px;padding:13px 18px;align-items:center;width:100%;background:none;border:0;text-align:left;cursor:pointer}
.wa .set:hover{background:color-mix(in srgb,var(--w-sub) 7%,transparent)}
.wa .set .ic{color:var(--w-sub)}
.wa .set .nm{font-weight:400;font-size:16px}
.wa .set .sb{white-space:normal;display:block;font-size:14px}
.wa .set.static{cursor:default}.wa .set.static:hover{background:none}
.wa .new{background:var(--w-green-ink);color:#fff;border-radius:6px;font-size:10.5px;padding:1px 6px;font-weight:600;letter-spacing:.2px}
:root[data-theme="dark"] .wa .new{color:#0b141a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .wa .new{color:#0b141a}}
.wa .red{color:var(--w-red)!important}
.wa .tg{width:40px;height:24px;border-radius:12px;background:transparent;border:2px solid var(--w-sub);position:relative;flex:none;cursor:pointer;padding:0}
.wa .tg::after{content:"";position:absolute;top:4px;left:4px;width:12px;height:12px;border-radius:50%;background:var(--w-sub);transition:left .15s,width .15s,height .15s,top .15s}
.wa .tg[aria-checked="true"]{background:var(--w-green);border-color:var(--w-green)}
.wa .tg[aria-checked="true"]::after{left:19px;top:2px;width:16px;height:16px;background:#fff}
:root[data-theme="dark"] .wa .tg[aria-checked="true"]::after{background:#0b141a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .wa .tg[aria-checked="true"]::after{background:#0b141a}}
.wa .btn{background:var(--w-green);color:#fff;border:0;border-radius:22px;padding:10px 24px;font-weight:500;font-size:14px;cursor:pointer}
:root[data-theme="dark"] .wa .btn{color:#0b141a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .wa .btn{color:#0b141a}}
.wa .btn.gh{background:none;color:var(--w-green-ink);border:1px solid var(--w-line)}
.wa .btn:disabled{opacity:.5;cursor:default}
.wa .meter{height:8px;border-radius:4px;background:var(--w-chip);overflow:hidden;display:flex;margin-top:8px}
.wa .meter i{display:block;height:100%}
.wa .lg{display:flex;gap:12px;font-size:12px;color:var(--w-sub);margin-top:6px;flex-wrap:wrap}
.wa .lg span::before{content:"";display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;background:var(--c)}
.wa .sum{margin:6px 14px;border-radius:16px;padding:14px 16px;background:var(--w-chip);display:grid;gap:6px}
.wa .sum .big{font-size:24px;font-weight:500;font-variant-numeric:tabular-nums}
.wa .sum .big s{color:var(--w-sub);font-size:16px;margin-right:8px;font-weight:400}
.wa .fit{font-size:13.5px;font-weight:500}
.wa .fit.ok{color:var(--w-green-ink)}.wa .fit.no{color:var(--w-red)}
.wa .num{font-variant-numeric:tabular-nums}
.wa .note{font-size:13px;color:var(--w-sub);padding:10px 18px 18px}
.wa .scrim{position:absolute;inset:0;background:var(--w-scrim);display:flex;align-items:flex-end;z-index:20}
.wa .scrim.mid{align-items:center;justify-content:center;padding:24px}
.wa .sheet{background:var(--w-sheet);width:100%;border-radius:24px 24px 0 0;padding:22px 22px 18px;display:grid;gap:12px}
.wa .dlg{background:var(--w-sheet);width:100%;border-radius:26px;padding:22px;display:grid;gap:10px}
.wa .sheet h4,.wa .dlg h4{margin:0;font-size:19px;font-weight:500}
.wa .sheet p,.wa .dlg p{margin:0;color:var(--w-sub);font-size:14.5px}
.wa .sheet ul{margin:0;padding-left:18px;font-size:14.5px;display:grid;gap:7px}
.wa .acts2{display:flex;justify-content:flex-end;gap:10px;margin-top:6px;flex-wrap:wrap}
.wa .radio{display:flex;align-items:center;gap:16px;padding:10px 2px;background:none;border:0;width:100%;text-align:left;cursor:pointer;font-size:15.5px}
.wa .radio i{width:20px;height:20px;border-radius:50%;border:2px solid var(--w-sub);flex:none;display:grid;place-items:center}
.wa .radio.on i{border-color:var(--w-green)}
.wa .radio.on i::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--w-green)}
.wa .menu{position:absolute;top:34px;right:8px;background:var(--w-sheet);border-radius:14px;box-shadow:0 6px 22px rgba(0,0,0,.22);z-index:21;min-width:200px;padding:6px 0}
.wa .menu button{display:block;width:100%;text-align:left;background:none;border:0;padding:12px 20px;font-size:15.5px;cursor:pointer}
.wa .menu button:hover{background:color-mix(in srgb,var(--w-sub) 10%,transparent)}
.wa .toast{position:absolute;left:50%;bottom:90px;transform:translateX(-50%);background:var(--w-toast);color:#fff;padding:10px 16px;border-radius:20px;font-size:13.5px;z-index:30;width:max-content;max-width:86%;text-align:center}
/* conversation */
.wa .conv{flex:1;background:var(--w-wall);background-image:radial-gradient(color-mix(in srgb,var(--w-sub) 13%,transparent) 1px,transparent 1.2px);background-size:18px 18px;padding:8px 10px 12px;display:flex;flex-direction:column;gap:3px;overflow-y:auto;scrollbar-width:none}
.wa .conv::-webkit-scrollbar{display:none}
.wa .ctb{display:flex;align-items:center;gap:2px;padding:6px 4px;min-height:58px;flex:none;background:var(--w-bg)}
.wa .ctb .who{display:flex;align-items:center;gap:10px;flex:1;min-width:0;background:none;border:0;padding:4px;border-radius:10px;cursor:pointer;text-align:left}
.wa .ctb .who .nm{font-size:16.5px}
.wa .ctb .who .sb{font-size:12.5px}
.wa .sys{align-self:center;background:var(--w-sys);color:var(--w-sys-ink);font-size:12.5px;padding:6px 10px;border-radius:8px;text-align:center;max-width:88%;margin:4px 0}
.wa .day{align-self:center;background:var(--w-in);color:var(--w-sub);font-size:12px;padding:4px 10px;border-radius:8px;margin:6px 0;box-shadow:0 1px .5px rgba(0,0,0,.1)}

  const sharedWith = id => SHARED.filter(x => (x.a === id || x.b === id)).map(x => ({other: chat(x.a === id ? x.b : x.a), gb: x.gb})).filter(x => x.other && !S.excluded.has(x.other.id));
  const starred = c => c.msgs.filter(m => m[5]).length;

  const exited = id => !!(chat(id) && chat(id).exited);

      case 'restorelocal': S.fromLocal = true; S.restoring = true; render(); requestAnimationFrame(() => requestAnimationFrame(() => { const p = root.querySelector('#wa-prog'); if (p) p.style.width = '100%'; })); setTimeout(() => { S.restoring = false; S.restored = true; render(); }, 1500); break;
      case 'send': sendMsg(v); break;
      case 'star': { const [id, i] = v.split('|'); const m = _chat(id).msgs[+i]; if (!m || m[0] === 'day' || m[0] === 'note') break; while (m.length < 5) m.push(m.length === 4 ? false : ''); m[5] = !m[5]; render(); toast(m[5] ? 'Message starred' : 'Removed from starred'); break; }
      case 'xfer': S.transfer = v; render(); if (v === 'moving') { requestAnimationFrame(() => requestAnimationFrame(() => { const p = root.querySelector('#wa-prog'); if (p) p.style.width = '100%'; })); setTimeout(() => { S.transfer = 'done'; render(); }, 1500); } break;
      case 'xferdone': { const n = S.excluded.size; S.transfer = null; S.stack = [{s: 'home'}]; S.tab = 'chats'; render(true); break; }
      case 'exit': S.overlay = {t: 'exit', id: v}; render(); break;
      case 'exitok': { const c = _chat(v); c.exited = true; c.msgs.push(['note', '', 'You left']); S.overlay = null; render(); break; }
      case 'clearok': { const c = _chat(v); c.msgs = []; c.gb = .001; c.unread = 0; S.overlay = null; render(); toast('Chat cleared'); break; }
      case 'delchatok': { S.chats = S.chats.filter(c => c.id !== v); S.excluded.delete(v); S.overlay = null; S.stack = [{s: 'home'}]; render(true); toast('Chat deleted'); break; }
    }
  });
  root.addEventListener('input', e => {
    if (e.target.id === 'wa-q') { S.q = e.target.value; render(); }
    if (e.target.id === 'wa-msg') syncSend();
  });
  root.addEventListener('keydown', e => {
    if (e.target.id === 'wa-msg' && e.key === 'Enter') { e.preventDefault(); sendMsg(top().s === 'meta' ? 'meta' : top().id); }
    if (e.key === 'Escape') back();
  });
  // chat() lookup also covers Meta AI
  fresh(opts.preset);
  render(true);

  return {
    state: S, kept, fits, total, FREE, saving,
    reset(preset) { fresh(preset); lastKey = null; render(true); },
    set(patch) { Object.assign(S, patch); render(true); },
    hint(k) { S.hint = k; render(); },
    finishRestore() { S.restored = true; finishRestore(); },
    reinstall() {
      S.sameDevice = true; S.fromLocal = false; S.newphone = true; S.restored = false; S.restoring = false; S.overlay = null; S.stack = [{s: 'restore'}]; render(true); return true;
    },
    onChange(fn) { listeners.push(fn); },
    top
  };
}
window.WA = {mount};
})();
</script>
<script>
const api = WA.mount(document.getElementById('phone'), {preset: 'failing'});
document.getElementById('reinstall').onclick = () => api.reinstall();
document.getElementById('reset').onclick = () => api.reset('failing');
const ab = document.getElementById('about-btn'), ap = document.getElementById('about-pop');
ab.onclick = () => { ap.hidden = !ap.hidden; ab.setAttribute('aria-expanded', !ap.hidden); };
document.addEventListener('click', e => { if (!e.target.closest('.about')) { ap.hidden = true; ab.setAttribute('aria-expanded', false); } });
</script>
